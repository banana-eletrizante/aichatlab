name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: |
          dotnet publish AIChatLab/AIChatLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - name: Rename
        shell: pwsh
        run: |
          Move-Item -Force dist/AIChatLab.exe dist/AIChatLab_v1.1-beta.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-beta
          name: AI Chat Lab v1.1 beta
          prerelease: true
          files: dist/AIChatLab_v1.1-beta.exe
          generate_release_notes: true
          body: |
            Beta da versão atual do AI Chat Lab (UI Lab Green, 6 passos, deploy Vercel).
            Executável Windows x64 self-contained. Não requer instalação separada do .NET.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
